<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141110" />
    <meta name="description" content="Guided stretching timer with audio and haptic cues." />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong palette.
      // Mirrors js/theme.js; defaults to dark (see DEFAULT_SETTINGS.theme).
      try {
        var saved = localStorage.getItem('stretchTimer.v1.settings');
        var pref = saved ? JSON.parse(saved).theme : 'dark';
        document.documentElement.dataset.theme =
          pref === 'light' || pref === 'system' ? pref : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Stretch Timer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stretch" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app" class="app"></main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
